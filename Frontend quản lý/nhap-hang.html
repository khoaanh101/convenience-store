<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhập hàng · Cửa hàng tiện lợi</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/nghiep-vu.css">
</head>
<body data-page="nhap-hang" data-title="Nhập hàng">
<main id="app">
  <form class="card" id="receive">
    <fieldset id="receive-fields" class="flow-fields" disabled>
      <div class="fields">
        <label>Mã nhập<input name="MaNH" required maxlength="10" pattern="[A-Za-z0-9_\-]+" title="Chữ không dấu, số, dấu gạch dưới hoặc gạch ngang"></label>
        <label>Ngày nhập<input name="NgayNhap" type="date" required></label>
        <label>Tìm hàng<input id="product-query" type="search" placeholder="Nhập mã hoặc tên hàng"></label>
        <label>Mặt hàng<select id="product" name="MaHH" required></select></label>
        <label class="full">Nhà cung cấp<select name="MaNCC" required></select></label>
        <label>Số lượng<input name="SoLuong" type="number" min="1" max="2147483647" step="1" required></label>
        <label>Đơn giá nhập<input name="DonGia" type="number" min="0.01" max="9999999999.99" step="0.01" required></label>
      </div>
      <div class="foot"><button class="btn pri">Lưu phiếu nhập</button></div>
    </fieldset>
    <p class="flow-status" id="status" role="status"></p>
  </form>
</main>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/nghiep-vu.js"></script>
<script src="js/nhap-hang.js"></script>
</body>
</html>
